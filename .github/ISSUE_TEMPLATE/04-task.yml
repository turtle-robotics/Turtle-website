name: Development task
description: Track maintenance or development work
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the task. Write the goal and the scope.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why the project needs this task.
    validations:
      required: true
  - type: textarea
    id: work-items
    attributes:
      label: Work items
      description: List the work items. Write each item on a new line. Use a checkbox for each item. This field is optional.
      placeholder: |
        - [ ] Work item 1
        - [ ] Work item 2
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add other information about the task. This field is optional.
    validations:
      required: false
